name: Deploy

# Deploys the single committee-snake Worker (API + static client as Workers
# Static Assets, ADR 0006) on every push to main after CI passes. Needs
# repository secrets:
#   CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit, Account:Read)
#   CLOUDFLARE_ACCOUNT_ID
# The job is skipped (not failed) until the repository variable
# DEPLOY_ENABLED is set to "true".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @committee-snake/client build

      # The Worker uploads apps/client/dist as its static assets, so the
      # client build above must run first.
      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
          command: deploy --env production
