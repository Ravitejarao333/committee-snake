version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["@biomejs/*", "vitest", "@vitest/*", "typescript", "knip", "husky", "lint-staged", "@commitlint/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
