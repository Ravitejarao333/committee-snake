<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="page" content="glass" />
    <title>Break Glass</title>
    <meta name="description" content="In case of boredom, break glass. Something is behind every pane." />
    <meta property="og:title" content="Break Glass" />
    <meta property="og:description" content="In case of boredom, break glass." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#a3161a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23a3161a'/%3E%3Crect x='1' y='1' width='6' height='6' fill='%23cfe0e8'/%3E%3Cpath fill='%23384850' d='M4 2h1v2H4zM3 4h1v1H3zM5 4h1v2H5zM2 5h1v1H2z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/glass/style.css" />
  </head>
  <body>
    <main class="box">
      <p class="label">IN CASE OF BOREDOM, BREAK GLASS.</p>
      <div class="pane" id="pane">
        <div class="reveal" id="reveal" aria-live="polite"></div>
        <div class="reveal" id="reveal-next" aria-hidden="true"></div>
        <canvas id="glass"></canvas>
        <p class="hint" id="hint" hidden>tap to turn sound on</p>
      </div>
      <footer class="strip">
        <output id="broken"><span data-local>0</span> <span data-noun>panes</span> broken<span data-global hidden> · — worldwide</span></output>
        <button type="button" id="last" hidden></button>
        <span class="tools">
          <button type="button" id="mute" aria-pressed="false">sound</button>
          <a href="/">games</a>
        </span>
      </footer>
    </main>
    <script type="module" src="/src/glass/main.ts"></script>
  </body>
</html>
