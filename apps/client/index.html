  <body>
    <main class="hub">
      <header>
        <h1>Cheap Thrills</h1>

      <ul class="games">
        <li>
          <a class="card" href="/snake" data-game="snake">
            <div class="preview preview-snake"><canvas aria-hidden="true"></canvas></div>
            <h2>Committee Snake</h2>
            <p class="hook">Everyone votes. The snake dies. Someone gets blamed.</p>
            <p class="playing"><span data-playing="snake">—</span> playing</p>
          </a>
        </li>
        <li>
          <a class="card" href="/glass" data-game="glass">
            <div class="preview preview-glass"><canvas aria-hidden="true"></canvas></div>
            <h2>Break Glass</h2>
            <p class="hook">In case of boredom, break glass.</p>
            <p class="playing"><span data-playing="glass">—</span> playing</p>
          </a>
        </li>
      </ul>
      <footer><a href="https://github.com/Ravitejarao333/committee-snake">GitHub</a></footer>
